
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc cần làm</title>
    <link rel="stylesheet" href="Bai16.css">
</head>
<body>

    <div class="ung-dung">

        <div class="tieu-de">
            <h2>Danh sách việc cần làm</h2>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá
                — tất cả bằng JavaScript.</p>
        </div>

        <div class="khu-vuc-nhap">
            <input
                type="text"
                id="cong-viec-moi"
                placeholder="Nhập công việc cần làm..."
            >
            <button id="nut-them">Thêm</button>
        </div>

        <ul id="danh-sach"></ul>

        <div class="thong-ke" id="thong-ke">
            Còn 0 việc chưa hoàn thành
        </div>

    </div>

    <script src="Bai16.js"></script>
</body>
</html>
