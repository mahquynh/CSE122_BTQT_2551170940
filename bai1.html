<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bai1.css">
</head>
<body>
      <div class="poem-container">
        <div class="title">
            <h1>BỐN MÙA</h1>
        </div>
        <div class="stanza">
            <div class="first">
                <p>
                    Xuân về hoa nở khắp trời
                    Hạ sang nắng cháy rạng ngời phố quen
                    Thu về lá rụng bên thềm
                </p>
            </div>
            <br>
            <hr>
            <br>
            <div class="second">
                <p>
                    Đông sang gió lạnh bên em đợi chờ
                    Bốn mùa là bốn giấc mơ
                    Thời gian đi mãi ta chờ đợi ai
                </p>
            </div>
            <br>
            <hr>
            <br>
            <div class="third">
                <p>
                    Một năm rồi lại một năm
                    Vẫn còn câu hát thì thầm quê hương
                    Chờ xuân nắng mới soi đường
                </p>
            </div>
        </div>
      </div>
</body>
</html>
