
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch ngày</title>
    <link rel="stylesheet" href="bai12.css">
</head>
<body>
    <div class="container">
        <div class="calendar">
            <div class="year" id="yearDisplay">2026</div>
            <div class="month" id="monthDisplay">Tháng 12</div>
            <div class="day" id="dayDisplay">24</div>
            <div class="weekday" id="weekdayDisplay">Thứ năm</div>
        </div>

        <p class="greeting" id="greeting">Chào buổi tối!</p>

        <form id="dateForm">
            <div class="input-group">
                <label for="day">Ngày</label>
                <input type="number" id="day" value="24"
                       min="1" max="31" required>
            </div>

            <div class="input-group">
                <label for="month">Tháng</label>
                <input type="number" id="month" value="12"
                       min="1" max="12" required>
            </div>

            <div class="input-group">
                <label for="year">Năm</label>
                <input type="number" id="year" value="2026"
                       min="1" max="9999" required>
            </div>

            <button type="submit">In lịch</button>
        </form>
    </div>

    <script src="bai12.js"></script>
</body>
</html>
