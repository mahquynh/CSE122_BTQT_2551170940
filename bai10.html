<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang liên hệ</title>
    <link rel="stylesheet" href="bai10.css">
</head>
<body>
    <div class="container">
        <h1>Liên hệ với chúng tôi</h1>
        <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong vòng 24 giờ</p>
    </div>
    <form action="#" method="post">
        <div class="form-body">
            <div class="form-grid">
              <div class="form-group">
                <label for="hoten">Họ và tên</label>
                <input type="text" id="hoten" name="hoten"
                       value="Nguyễn Văn An" required>
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       vale="an.nv@tlu.edu.vn" required>
              </div>
              <div class="form-group">
                <label for="sdt">Số điện thoại</label>
                <input type="tel" id="sdt" name="sdt"
                       value="0987 654 321">
              </div>
              <div class="form-group">
                <label for="chude">Chủ đề</label>
                <select id="chude" name="chude">
                    <option value="khoa-hoc" slected>
                        Hỏi về khóa học
                    </option>
                    <option value="hoc-phi">Hỏi về học phí</option>
                    <option value="ky-thuat">Hỗ trợ kỹ thuật</option>
                    <option value="khac">Khác</option>
                </select>
              </div>
            </div>
            <div class="form-group content-group">
                <label for="noidung">Nội dung</label>
                <textarea id="noidung" name="noidung"
                          rows="4" required> Em muốn hỏi về lịch sử nộp bài tập môn Lập trình Web ạ</textarea>
            </div>
            <div class="form-footer">
                <div class="checkbox-group">
                    <input type="checkbox" id="dongy"
                           name="dongy" checked>
                           <label for="dongy">
                            Tôi đồng ý nhận email phản hồi.
                           </label>
                </div> 
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn-submit">
                    Gửi liên hệ
                </button>
                <button type="reset" class="btn-reset">
                    Nhập lại
                </button>
            </div>
        </div>
    </form>
</body>
</html>
