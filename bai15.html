
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính</title>
    <link rel="stylesheet" href="bai15.css">
</head>
<body>

    <div class="may-tinh">

        <div class="man-hinh">
            <div id="phep-tinh">12 + 8 × 3</div>
            <div id="ket-qua">36</div>
        </div>

        <div class="ban-phim">
            <button class="xoa" onclick="xoaTatCa()">C</button>
            <button class="chuc-nang" onclick="themKyTu('(')">( )</button>
            <button class="chuc-nang" onclick="themKyTu('%')">%</button>
            <button class="chuc-nang" onclick="themKyTu('/')">÷</button>

            <button onclick="themKyTu('7')">7</button>
            <button onclick="themKyTu('8')">8</button>
            <button onclick="themKyTu('9')">9</button>
            <button class="chuc-nang" onclick="themKyTu('*')">×</button>

            <button onclick="themKyTu('4')">4</button>
            <button onclick="themKyTu('5')">5</button>
            <button onclick="themKyTu('6')">6</button>
            <button class="chuc-nang" onclick="themKyTu('-')">−</button>

            <button onclick="themKyTu('1')">1</button>
            <button onclick="themKyTu('2')">2</button>
            <button onclick="themKyTu('3')">3</button>
            <button class="chuc-nang" onclick="themKyTu('+')">+</button>

            <button class="so-0" onclick="themKyTu('0')">0</button>
            <button onclick="themKyTu('.')">.</button>
            <button class="bang" onclick="tinhToan()">=</button>
        </div>

    </div>

    <script src="bai15.js"></script>
</body>
</html>
